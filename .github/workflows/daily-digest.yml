name: Daily Market Digest

on:
  schedule:
    # Runs at 12:00 UTC every day (adjust for your timezone as needed)
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vaderSentiment requests

      - name: Fetch headlines
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python fetch_news.py

      - name: Run sentiment analysis
        run: python analyze_sentiment.py

      - name: Generate site
        run: python generate_site.py

      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html headlines.json analysis.json
          git commit -m "Daily digest update: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
